name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TF2Configurator.slnx

      - name: Build
        run: dotnet build TF2Configurator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests\TF2Configurator.Tests -c Release --no-build

      - name: Publish (self-contained, win-x64)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet publish src\TF2Configurator -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: TF2Configurator-win-x64
          path: publish/
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TF2Configurator.exe
          generate_release_notes: true